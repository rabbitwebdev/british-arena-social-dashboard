<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Company connections | Social Dashboard</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#14274c;background:#f6f8fc}*{box-sizing:border-box}
body{max-width:1000px;margin:0 auto;padding:32px 20px}h1,h2{line-height:1.2}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}
a{color:#0B1F55}button,input,select{font:inherit;border-radius:0;padding:10px 14px;border:1px solid #9aaac2}
button{background:#0B1F55;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
.card{background:#fff;border:1px solid #d8e0ee;padding:22px;margin:16px 0}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.grow{flex:1}
.remove-panel{margin-top:22px;padding:16px;border:1px solid #c9929d;background:#fff7f8}
.remove-panel input{min-width:260px;background:white;color:#14274c}
.remove-panel button{background:#8a2233;border-color:#8a2233}
.remove-panel p{margin:8px 0}
.company-id{font-size:12px;color:#64728a;word-break:break-all}
small,.muted{color:#51627c}.danger{background:#8a2233}#message{min-height:22px}
</style>
<header><div><h1>Company connections</h1><p class="muted">Each company authorizes its own Facebook Pages.</p></div><a href="/login">Sign in</a></header>
<div id="message" role="status" aria-live="polite"></div>
<p id="platform-link" hidden><a href="/platform-integrations">Platform integrations (administrators only)</a></p>
<section id="new-company" class="card" hidden>
<h2>Add company</h2><form id="company-form" class="row">
<label for="name">Company name</label><input id="name" minlength="2" maxlength="100" required>
<button>Add company</button></form></section>
<div id="companies"></div>
<script>
"use strict";
const message=document.getElementById("message");
const companies=document.getElementById("companies");
async function api(path,options){
 const r=await fetch(path,{credentials:"same-origin",...options});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.error||"Request failed ("+r.status+")");
 return data;
}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(text,click,cls){const b=el("button",text,cls);b.type="button";b.addEventListener("click",click);return b}
async function reload(){
 companies.replaceChildren();message.textContent="";
 try{
 const current=await api("/api/me");
 if(!current.user)throw new Error("Please sign in first.");
 document.getElementById("new-company").hidden=current.user.role!=="admin";
 document.getElementById("platform-link").hidden=current.user.role!=="admin";
 const items=(await api("/api/organisations")).organisations;
 if(!items.length)companies.append(el("p","No companies assigned."));
 for(const org of items){
   const section=el("section",undefined,"card");
   section.append(el("h2",org.name),el("p","Your role: "+org.role,"muted"));
   const fullId=el("small","Company ID: "+org.id,"company-id");section.append(fullId);
   if(current.user.role==="admin"){
     if(org.id==="british-arena"){
       section.append(el("p","Original British Arena company · protected from deletion","muted"));
     }else{
       const deleteButton=button("Delete company",()=>{
         const panel=el("div",undefined,"remove-panel");
         panel.append(el("h3","Permanently delete "+org.name+"?"));
         panel.append(el("p","This deletes the company's Facebook/Instagram connections, TV settings, private screen link, invitations and uploaded images. It cannot be undone."));
         panel.append(el("p","Company ID: "+org.id,"company-id"));
         panel.append(el("p","Enter DELETE "+org.name+" to confirm."));
         const phrase=document.createElement("input");
         phrase.type="text";phrase.autocomplete="off";
         phrase.placeholder="DELETE "+org.name;
         phrase.setAttribute("aria-label","Type DELETE and the company name");
         const confirmDelete=button("Permanently delete",async()=>{
           if(phrase.value!=="DELETE "+org.name){message.textContent="Type DELETE "+org.name+" exactly.";return}
           if(!confirm("Final confirmation: permanently delete "+org.name+" ("+org.id+")?"))return;
           confirmDelete.disabled=true;
           try{
             const result=await api("/api/organisations/"+encodeURIComponent(org.id)+"/delete",{
               method:"POST",headers:{"Content-Type":"application/json"},
               body:JSON.stringify({id:org.id,name:org.name,phrase:phrase.value})
             });
             await reload();
             message.textContent=result.media_cleaned?"Company deleted.":"Company deleted. Some quarantined image files need cleanup.";
           }catch(e){message.textContent=e.message;confirmDelete.disabled=false}
         },"danger");
         const cancel=button("Cancel",()=>panel.remove());
         panel.append(phrase,confirmDelete,cancel);
         deleteButton.replaceWith(panel);
       },"danger");
       deleteButton.style.marginTop="16px";
       section.append(deleteButton);
     }
   }
   const dashboard=document.createElement("a");
   dashboard.href="/company/"+encodeURIComponent(org.id);
   dashboard.textContent="Manage dashboard & TV screen";
   dashboard.style.display="inline-block";dashboard.style.marginBottom="16px";
   section.append(dashboard);
   if(org.role==="owner"){
     const invitePanel=el("div",undefined,"card");
     invitePanel.style.background="#f2f5fa";
     invitePanel.append(el("h3","Invite a client or colleague"));
     const form=document.createElement("form");form.className="row";
     const email=document.createElement("input");email.type="email";email.placeholder="client@example.com";email.required=true;email.maxLength=254;email.setAttribute("aria-label","Client email address");
     const role=document.createElement("select");role.setAttribute("aria-label","Company role");
     for(const [value,title] of [["owner","Owner"],["manager","Manager"],["viewer","Viewer"]]){
       const opt=document.createElement("option");opt.value=value;opt.textContent=title;role.append(opt);
     }
     const submit=document.createElement("button");submit.textContent="Send invitation";submit.type="submit";
     const result=el("p",undefined,"muted");result.setAttribute("role","status");
     form.append(email,role,submit);
     form.addEventListener("submit",async event=>{
       event.preventDefault();submit.disabled=true;result.replaceChildren();
       try{
         const data=await api("/api/organisations/"+encodeURIComponent(org.id)+"/invitations",{
           method:"POST",headers:{"Content-Type":"application/json"},
           body:JSON.stringify({email:email.value,role:role.value})});
         if(data.sent){result.textContent="Invitation email sent to "+data.email+" (expires in 48 hours).";}
         else{
           result.textContent="Email delivery is not configured. Copy this one-time invitation link securely and send it to the client:";
           const field=document.createElement("input");field.readOnly=true;field.value=data.invite_url;
           field.style.width="100%";field.setAttribute("aria-label","One-time invitation URL");
           const copy=button("Copy invitation link",()=>navigator.clipboard.writeText(field.value).then(()=>{result.insertBefore(el("small","Copied. Send this link privately."),field);}));
           result.append(field,copy);
         }
         email.value="";
       }catch(err){result.textContent=err.message}
       finally{submit.disabled=false}
     });
     invitePanel.append(form,result);section.append(invitePanel);
   }
   const body=el("div");section.append(body);
   const render=async()=>{
     body.replaceChildren();
     try{
       const list=(await api("/api/organisations/"+encodeURIComponent(org.id)+"/meta/connections")).connections;
       if(!list.length)body.append(el("p","No Facebook Page connected yet.","muted"));
       for(const p of list){
         const row=el("div",undefined,"row");
         row.append(el("strong",p.page_name),el("small",p.instagram_username?"Instagram: @"+p.instagram_username:"No linked Instagram account","grow"));
         if(org.role!=="viewer")row.append(button("Disconnect",async()=>{
           if(!confirm("Disconnect "+p.page_name+" from "+org.name+"?"))return;
           try{
             await api("/api/organisations/"+encodeURIComponent(org.id)+"/meta/disconnect",{
               method:"POST",headers:{"Content-Type":"application/json"},
               body:JSON.stringify({page_id:p.page_id})});
             await render();
           }catch(e){message.textContent=e.message}
         },"danger"));
         body.append(row);
       }
     }catch(e){body.append(el("p",e.message))}
   };
   if(org.role!=="viewer"){
     const availability=await api("/api/organisations/"+encodeURIComponent(org.id)+"/meta/availability");
     if(availability.available){
       section.append(button("Connect Facebook / Instagram",()=>{
         location.assign("/api/organisations/"+encodeURIComponent(org.id)+"/meta/connect");
       }));
       section.append(el("small","Choose your Facebook Page after signing in to Meta.","muted"));
     }else{
       const disabled=button("Facebook / Instagram connection coming soon",()=>{});
       disabled.disabled=true;
       section.append(disabled);
       section.append(el("p",availability.message,"muted"));
     }
   }
   companies.append(section);
   await render();
 }
 }catch(e){message.textContent=e.message}
}
document.getElementById("company-form").addEventListener("submit",async e=>{
 e.preventDefault();
 try{
   await api("/api/organisations",{method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({name:document.getElementById("name").value})});
   document.getElementById("name").value="";
   await reload();
 }catch(err){message.textContent=err.message}
});
reload();
</script></html>

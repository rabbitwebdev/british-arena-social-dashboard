name: Tenant Meta and client onboarding security tests
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "cryptography>=43,<49" "requests>=2.31,<3" "Flask>=3,<4" "segno>=1.6,<2"
      - name: Test tenancy and Meta OAuth storage
        run: python -m unittest discover -s tests -v
      - name: Check stdlib dashboard compiles
        run: python -m py_compile server.py meta_connect.py tenant_meta.py tenant_screens.py client_onboarding.py

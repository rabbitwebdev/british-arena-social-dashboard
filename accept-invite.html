<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept invitation · Social Dashboard</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#f3f5fa;color:#13274c;min-height:95vh;display:grid;place-items:center;padding:18px}main{width:min(100%,480px);border:1px solid #d5dbe8;background:#fff;padding:35px}h1{line-height:1.2;font-size:28px}label{display:block;font-weight:650;margin-top:20px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:13px;border-radius:0}input{border:1px solid #9fa8ba}button{background:#0B1F55;color:white;border:0;margin-top:20px;cursor:pointer}button:disabled{opacity:.55}small{color:#55647a}#message{min-height:24px;color:#8a2233}</style>
<main><h1>Welcome to Social Dashboard</h1><p id="company">Checking your invitation…</p><p id="message" role="alert"></p><form id="activate" hidden><label for="email">Email address</label><input id="email" readonly><label for="password">Create a password</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required placeholder="At least 12 characters"><small>Use a unique password of at least 12 characters.</small><button>Create account and continue</button></form><p><a href="/login">Already have an account? Sign in</a></p></main>
<script>
"use strict";
const token=new URLSearchParams(location.hash.slice(1)).get("token")||"";
history.replaceState(null,"",location.pathname);
const $=id=>document.getElementById(id);
async function request(url,payload){
 const res=await fetch(url,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
 const data=await res.json().catch(()=>({}));
 if(!res.ok)throw Error(data.error||"Request failed");
 return data;
}
(async()=>{if(!token)throw Error("Invitation link is missing or invalid");
 const invite=await request("/api/invitations/inspect",{token});
 $("company").textContent="You've been invited to "+invite.organisation+" as "+invite.role+".";
 $("email").value=invite.email;$("activate").hidden=false;
})().catch(error=>{$("company").textContent="Unable to use this invitation";$("message").textContent=error.message});
$("activate").onsubmit=async event=>{
 event.preventDefault();const button=$("activate").querySelector("button");button.disabled=true;
 try{
  const response=await fetch("/api/invitations/accept",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:$("password").value}),redirect:"follow"});
  if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.error||"Account setup failed");}
  // The server sets the new session cookie and redirects to the guided onboarding page.
  location.assign(response.url);
 }catch(error){$("message").textContent=error.message;button.disabled=false}
};
</script></html>
